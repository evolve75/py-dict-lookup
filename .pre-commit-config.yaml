repos:
  # Basic hygiene: whitespace, EOF, YAML validity, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Ruff: lint + (optionally) formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy: run via uv so it uses your locked environment
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv)
        entry: uv run --frozen mypy src tests
        language: system
        pass_filenames: false

      # Optional: pytest (can be slow; keep if you like gating commits)
      - id: pytest
        name: pytest (uv)
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
